<svg viewBox="0 0 840 280" xmlns="http://www.w3.org/2000/svg">
  <title>Aman — build in print — GitHub banner</title>
  <defs>
    <pattern id="halfCo" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="8" height="8" fill="#2447C7"/>
      <circle cx="4" cy="4" r="2.6" fill="#FBF3E3"/>
      <animate attributeName="x" from="0" to="8" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" from="0" to="8" dur="4.2s" repeatCount="indefinite"/>
    </pattern>
    <pattern id="chkNv" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="8" height="8" fill="#221D3D"/>
      <rect x="0" y="0" width="4" height="4" fill="#FBF3E3"/>
      <rect x="4" y="4" width="4" height="4" fill="#FBF3E3"/>
      <animate attributeName="x" from="0" to="8" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y" from="0" to="8" dur="4.8s" repeatCount="indefinite"/>
    </pattern>
    <pattern id="halfNv" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="8" height="8" fill="#221D3D"/>
      <circle cx="4" cy="4" r="2.6" fill="#FBF3E3"/>
      <animate attributeName="x" from="0" to="8" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y" from="0" to="8" dur="4.8s" repeatCount="indefinite"/>
    </pattern>
    <pattern id="rollPatt" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#FFFFFF"/>
      <rect x="2" y="2" width="2" height="2" fill="#FFFFFF"/>
      <animate attributeName="x" from="0" to="4" dur="0.4s" repeatCount="indefinite"/>
    </pattern>

    <!-- ROLL-UP DITHER MASKS: one per text line; a dither band rolls up, solid white follows -->
    <mask id="rm1" maskUnits="userSpaceOnUse" x="355" y="37" width="440" height="28">
      <rect x="355" y="39" width="440" height="26" fill="#000000"/>
      <rect x="355" y="65" width="440" height="26" fill="url(#rollPatt)">
        <animate attributeName="y" dur="23.2s" begin="0.8s" repeatCount="indefinite"
          keyTimes="0;0.065;0.871;0.91;1" values="65;13;13;65;65"/>
      </rect>
      <rect x="355" y="65" width="440" height="26" fill="#FFFFFF">
        <animate attributeName="y" dur="23.2s" begin="0.8s" repeatCount="indefinite"
          keyTimes="0;0.065;0.871;0.91;1" values="65;39;39;65;65"/>
      </rect>
    </mask>
    <mask id="rm2" maskUnits="userSpaceOnUse" x="355" y="65" width="440" height="28">
      <rect x="355" y="67" width="440" height="26" fill="#000000"/>
      <rect x="355" y="93" width="440" height="26" fill="url(#rollPatt)">
        <animate attributeName="y" dur="22.3s" begin="1.7s" repeatCount="indefinite"
          keyTimes="0;0.067;0.865;0.906;1" values="93;41;41;93;93"/>
      </rect>
      <rect x="355" y="93" width="440" height="26" fill="#FFFFFF">
        <animate attributeName="y" dur="22.3s" begin="1.7s" repeatCount="indefinite"
          keyTimes="0;0.067;0.865;0.906;1" values="93;67;67;93;93"/>
      </rect>
    </mask>
    <mask id="rm3" maskUnits="userSpaceOnUse" x="355" y="93" width="440" height="28">
      <rect x="355" y="95" width="440" height="26" fill="#000000"/>
      <rect x="355" y="121" width="440" height="26" fill="url(#rollPatt)">
        <animate attributeName="y" dur="21.4s" begin="2.6s" repeatCount="indefinite"
          keyTimes="0;0.07;0.86;0.902;1" values="121;69;69;121;121"/>
      </rect>
      <rect x="355" y="121" width="440" height="26" fill="#FFFFFF">
        <animate attributeName="y" dur="21.4s" begin="2.6s" repeatCount="indefinite"
          keyTimes="0;0.07;0.86;0.902;1" values="121;95;95;121;121"/>
      </rect>
    </mask>
    <mask id="rm4" maskUnits="userSpaceOnUse" x="355" y="121" width="440" height="28">
      <rect x="355" y="123" width="440" height="26" fill="#000000"/>
      <rect x="355" y="149" width="440" height="26" fill="url(#rollPatt)">
        <animate attributeName="y" dur="20.5s" begin="3.5s" repeatCount="indefinite"
          keyTimes="0;0.073;0.854;0.898;1" values="149;97;97;149;149"/>
      </rect>
      <rect x="355" y="149" width="440" height="26" fill="#FFFFFF">
        <animate attributeName="y" dur="20.5s" begin="3.5s" repeatCount="indefinite"
          keyTimes="0;0.073;0.854;0.898;1" values="149;123;123;149;149"/>
      </rect>
    </mask>
    <mask id="rm5" maskUnits="userSpaceOnUse" x="355" y="149" width="440" height="28">
      <rect x="355" y="151" width="440" height="26" fill="#000000"/>
      <rect x="355" y="177" width="440" height="26" fill="url(#rollPatt)">
        <animate attributeName="y" dur="19.6s" begin="4.4s" repeatCount="indefinite"
          keyTimes="0;0.077;0.847;0.893;1" values="177;125;125;177;177"/>
      </rect>
      <rect x="355" y="177" width="440" height="26" fill="#FFFFFF">
        <animate attributeName="y" dur="19.6s" begin="4.4s" repeatCount="indefinite"
          keyTimes="0;0.077;0.847;0.893;1" values="177;151;151;177;177"/>
      </rect>
    </mask>
    <mask id="rm6" maskUnits="userSpaceOnUse" x="355" y="177" width="440" height="28">
      <rect x="355" y="179" width="440" height="26" fill="#000000"/>
      <rect x="355" y="205" width="440" height="26" fill="url(#rollPatt)">
        <animate attributeName="y" dur="18.7s" begin="5.3s" repeatCount="indefinite"
          keyTimes="0;0.08;0.839;0.888;1" values="205;153;153;205;205"/>
      </rect>
      <rect x="355" y="205" width="440" height="26" fill="#FFFFFF">
        <animate attributeName="y" dur="18.7s" begin="5.3s" repeatCount="indefinite"
          keyTimes="0;0.08;0.839;0.888;1" values="205;179;179;205;205"/>
      </rect>
    </mask>
    <mask id="rm7" maskUnits="userSpaceOnUse" x="355" y="205" width="440" height="28">
      <rect x="355" y="207" width="440" height="26" fill="#000000"/>
      <rect x="355" y="233" width="440" height="26" fill="url(#rollPatt)">
        <animate attributeName="y" dur="17.8s" begin="6.2s" repeatCount="indefinite"
          keyTimes="0;0.084;0.831;0.882;1" values="233;181;181;233;233"/>
      </rect>
      <rect x="355" y="233" width="440" height="26" fill="#FFFFFF">
        <animate attributeName="y" dur="17.8s" begin="6.2s" repeatCount="indefinite"
          keyTimes="0;0.084;0.831;0.882;1" values="233;207;207;233;233"/>
      </rect>
    </mask>

    <pattern id="sparseDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="1" y="2" width="2" height="2" fill="#FFFFFF"/>
      <rect x="5" y="11" width="2" height="2" fill="#FFFFFF"/>
      <rect x="9" y="5" width="2" height="2" fill="#FFFFFF"/>
      <rect x="13" y="13" width="2" height="2" fill="#FFFFFF"/>
      <rect x="2" y="8" width="2" height="2" fill="#FFFFFF"/>
      <rect x="11" y="1" width="2" height="2" fill="#FFFFFF"/>
      <rect x="6" y="15" width="2" height="2" fill="#FFFFFF"/>
      <rect x="15" y="7" width="2" height="2" fill="#FFFFFF"/>
      <animate attributeName="x" from="0" to="16" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="y" from="0" to="16" dur="4.4s" repeatCount="indefinite"/>
    </pattern>
    <pattern id="midDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#FFFFFF"/>
      <rect x="3" y="4" width="2" height="2" fill="#FFFFFF"/>
      <rect x="7" y="2" width="2" height="2" fill="#FFFFFF"/>
      <rect x="12" y="6" width="2" height="2" fill="#FFFFFF"/>
      <rect x="0" y="9" width="2" height="2" fill="#FFFFFF"/>
      <rect x="8" y="8" width="2" height="2" fill="#FFFFFF"/>
      <rect x="4" y="12" width="2" height="2" fill="#FFFFFF"/>
      <rect x="14" y="10" width="2" height="2" fill="#FFFFFF"/>
      <rect x="10" y="14" width="2" height="2" fill="#FFFFFF"/>
      <rect x="7" y="15" width="2" height="2" fill="#FFFFFF"/>
      <rect x="13" y="2" width="2" height="2" fill="#FFFFFF"/>
      <rect x="2" y="14" width="2" height="2" fill="#FFFFFF"/>
      <rect x="5" y="7" width="2" height="2" fill="#FFFFFF"/>
      <rect x="11" y="11" width="2" height="2" fill="#FFFFFF"/>
      <rect x="9" y="0" width="2" height="2" fill="#FFFFFF"/>
      <rect x="1" y="5" width="2" height="2" fill="#FFFFFF"/>
      <rect x="15" y="4" width="2" height="2" fill="#FFFFFF"/>
      <rect x="6" y="9" width="2" height="2" fill="#FFFFFF"/>
      <animate attributeName="x" from="0" to="16" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y" from="0" to="16" dur="3.1s" repeatCount="indefinite"/>
    </pattern>

        <mask id="picReveal" maskUnits="userSpaceOnUse" x="55" y="43" width="185" height="190">
      <rect x="55" y="45" width="185" height="185" fill="#000000"/>
      <rect x="55" y="45" width="185" height="185" fill="url(#sparseDots)">
        <animate attributeName="opacity" dur="13s" begin="0.6s" repeatCount="indefinite"
          keyTimes="0;0.01;0.72;0.77;1" values="0;1;1;0;0"/>
      </rect>
      <rect x="55" y="45" width="185" height="185" fill="url(#midDots)">
        <animate attributeName="opacity" dur="13s" begin="0.6s" repeatCount="indefinite"
          keyTimes="0;0.01;0.115;0.135;0.72;0.77;1" values="0;0;1;1;1;0;0"/>
      </rect>
      <rect x="55" y="45" width="185" height="185" fill="#FFFFFF">
        <animate attributeName="opacity" dur="13s" begin="0.6s" repeatCount="indefinite"
          keyTimes="0;0.115;0.223;0.243;0.72;0.77;1" values="0;0;1;1;1;0;0"/>
      </rect>
    </mask>

    <clipPath id="pageClip"><rect x="0" y="0" width="840" height="280"/></clipPath>
  </defs>

  <rect x="0" y="0" width="840" height="280" fill="#FBF3E3"/>

  <g clip-path="url(#pageClip)">

    <!-- COBALT BLOCK -->
    <rect x="0" y="0" width="330" height="280" fill="#2447C7"/>
    <circle cx="18" cy="18" r="9" fill="none" stroke="#FBF3E3" stroke-width="2" opacity="0.85"/>
    <path d="M308,16 L320,16 M314,10 L314,22" stroke="#FBF3E3" stroke-width="2" opacity="0.85"/>

    <!-- PHOTO AS STATIC DITHER PRINT: random dots scatter across the whole area and densify into the full pic (no direction) -->
    <g mask="url(#picReveal)">
      <image x="55" y="45" width="185" height="185" preserveAspectRatio="xMidYMid slice" href="data:image/png;base64,"/>

      <rect x="55" y="45" width="185" height="185" fill="none" stroke="#FBF3E3" stroke-width="3"/>
    </g>

    <!-- ROLL-UP DITHER TEXT: each line rolls up, dither pixels leading, then holds solid -->
    <text x="355" y="58" mask="url(#rm1)" font-family="Georgia, 'Times New Roman', Times, serif" font-size="20" font-weight="600" fill="#2447C7">Hi, it's Aman here.</text>
    <text x="355" y="86" mask="url(#rm2)" font-family="Georgia, 'Times New Roman', Times, serif" font-size="20" font-weight="600" fill="#2447C7">Hope you're having a good day.</text>
    <text x="355" y="114" mask="url(#rm3)" font-family="Georgia, 'Times New Roman', Times, serif" font-size="20" font-weight="600" fill="#2447C7">This is where I share what I build.</text>
    <text x="355" y="142" mask="url(#rm4)" font-family="Georgia, 'Times New Roman', Times, serif" font-size="20" font-weight="600" fill="#2447C7">Mostly curiosity-driven projects.</text>
    <text x="355" y="170" mask="url(#rm5)" font-family="Georgia, 'Times New Roman', Times, serif" font-size="20" font-weight="600" fill="#2447C7">Some powered by AI, some by late nights.</text>
    <text x="355" y="198" mask="url(#rm6)" font-family="Georgia, 'Times New Roman', Times, serif" font-size="20" font-weight="600" fill="#2447C7">Still a student. Still learning.</text>
    <text x="355" y="226" mask="url(#rm7)" font-family="Georgia, 'Times New Roman', Times, serif" font-size="20" font-weight="600" fill="#2447C7">Open to your issues and pull requests!</text>

    <!-- DITHER WAVE: one row at the very bottom, toggling between two alpha pattern styles -->
    <rect x="-10" y="270" width="860" height="10" fill="url(#halfCo)" shape-rendering="crispEdges">
      <animate attributeName="opacity" dur="5.2s" repeatCount="indefinite"
        keyTimes="0;0.2;0.35;0.65;0.8;1" values="1;1;0;0;1;1"/>
    </rect>
    <rect x="-10" y="270" width="860" height="10" fill="url(#chkNv)" shape-rendering="crispEdges">
      <animate attributeName="opacity" dur="5.2s" repeatCount="indefinite"
        keyTimes="0;0.2;0.35;0.65;0.8;1" values="0;0;1;1;0;0"/>
    </rect>
  </g>
</svg>
